name: CI & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint / typecheck / test / build / e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # 添付 Excel から取り込んだ基準ルートを、CI でも再検算する。
      # 不一致が 1 件でもあればここで落ちる（データは自動修正しない）。
      - name: Validate checkout table against source Excel
        run: npm run import:checkout -- --check

      - name: Verify generated data is up to date
        run: |
          npm run import:checkout
          if ! git diff --quiet -- src/data/standardCheckoutRoutes.generated.ts; then
            echo "::error::src/data/standardCheckoutRoutes.generated.ts が Excel と同期していません。npm run import:checkout を実行してコミットしてください。"
            git --no-pager diff -- src/data/standardCheckoutRoutes.generated.ts
            exit 1
          fi

      - name: Unit tests
        run: npm run test

      # TRAINING の大量品質監査（10 万問 × 各モード）。
      # 通常の unit test は高速に保ち、統計監査はここで回す。
      - name: TRAINING statistical audit
        run: npm run audit:training

      # SIMULATION の散布モデル監査（PPR キャリブレーション・ブレ方向・最大ブレ）。
      # ここも通常の unit test からは分離している。
      - name: SIMULATION scatter model audit
        run: npm run audit:simulation

      - name: SIMULATION review alignment audit
        run: npm run audit:review

      # E2E はルートパス（base = /）のビルドに対して実行する。
      # 通常の CI は Developer Gate を閉じたまま（VITE_AI_FEATURES 未設定）で検査する。
      - name: Build (for E2E, Developer Gate closed)
        run: npm run build

      # 通常の E2E は base = / で動かすため、GitHub Pages のサブパス配信は
      # ビルド成果物の静的検証で担保する（asset / manifest / Service Worker）。
      # 検証するのは Pages と同じ設定（base path ＋ VITE_AI_FEATURES=on。scripts/lib/pagesBuild.mjs）。
      - name: Validate GitHub Pages base path build
        run: npm run check:base

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests (Developer Gate closed)
        run: npm run test:e2e

      # GitHub Pages へ出すのと同じ設定（base path ＋ VITE_AI_FEATURES=on）でビルドし、
      # その成果物を base path で配信して AI MODEL LAB の入口・遅延読み込み・precache 除外・
      # 「明示操作なしにモデルを取得しない」を確かめる。実モデルは取得しない（外部通信は遮断して検出）。
      - name: E2E tests (Developer Gate open, GitHub Pages build)
        run: npm run test:e2e:gate-open

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            playwright-report-gate-open
          retention-days: 7

  build-pages:
    name: Build for GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # リポジトリ名からベースパスを決定する。
      # <user>.github.io 形式のリポジトリだけはルート公開なので "/" にする。
      - name: Resolve base path
        id: base
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          owner="${GITHUB_REPOSITORY%%/*}"
          if [ "$(echo "$repo" | tr '[:upper:]' '[:lower:]')" = "$(echo "$owner" | tr '[:upper:]' '[:lower:]').github.io" ]; then
            echo "path=/" >> "$GITHUB_OUTPUT"
          else
            echo "path=/$repo/" >> "$GITHUB_OUTPUT"
          fi

      # Beta の Pages 成果物に限って Developer Gate を開く（AI MODEL LAB を使える）。
      # base path（repository 名から算出）と VITE_AI_FEATURES=on を同時に反映する（scripts/lib/pagesBuild.mjs）。
      - name: Build (GitHub Pages, Developer Gate open)
        run: npm run build:pages
        env:
          VITE_BASE_PATH: ${{ steps.base.outputs.path }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build-pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
